services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paastech}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-paastech}"
      POSTGRES_DB: "${POSTGRES_DB:-paastech}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paastech"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - paas-net

volumes:
  postgres_dev_data:

networks:
  paas-net:
    external: true
