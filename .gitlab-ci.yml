stages:
  - pre-check
  - build
  - verify
  - documentation

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  SQLX_OFFLINE: "true"

.rust-base:
  image: rust:1
  before_script:
    - export PATH="$CI_PROJECT_DIR/.cargo/bin:$PATH"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - .cargo/git/
      - .cargo/bin/
    policy: pull

.verify-cache:
  cache:
    - key: "$CI_COMMIT_REF_SLUG"
      paths:
        - .cargo/registry/
        - .cargo/git/
        - .cargo/bin/
      policy: pull
    - key: "target-$CI_PIPELINE_ID"
      paths:
        - target/
      policy: pull

include:
  - .gitlab/ci/lint.yml
  - .gitlab/ci/build.yml
  - .gitlab/ci/test.yml
  - .gitlab/ci/security.yml
  - .gitlab/ci/documentation.yml
