services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paastech}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-paastech}"
      POSTGRES_DB: "${POSTGRES_DB:-paastech}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paastech"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - paas-net

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-paastech}:${POSTGRES_PASSWORD:-paastech}@db:5432/${POSTGRES_DB:-paastech}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - paas-net

networks:
  internal:
    driver: bridge
  paas-net:
    name: paas-net

volumes:
  postgres_data:
