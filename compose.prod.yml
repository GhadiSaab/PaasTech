services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paastech}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-paastech}"
      POSTGRES_DB: "${POSTGRES_DB:-paastech}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paastech"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-paastech}:${POSTGRES_PASSWORD:-paastech}@db:5432/${POSTGRES_DB:-paastech}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
