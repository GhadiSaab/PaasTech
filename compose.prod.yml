services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paastech}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-paastech}"
      POSTGRES_DB: "${POSTGRES_DB:-paastech}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paastech"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.6.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=paas-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - paas-net

  api:
    image: "${PAASTECH_IMAGE}"
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8080}"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-paastech}:${POSTGRES_PASSWORD:-paastech}@db:5432/${POSTGRES_DB:-paastech}"
      BASE_DOMAIN: "${BASE_DOMAIN}"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - paas-net
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:${PORT:-8080}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${BASE_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.api.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.api.loadbalancer.server.port=${PORT:-8080}"

networks:
  internal:
    driver: bridge
  paas-net:
    name: paas-net

volumes:
  postgres_data:
  letsencrypt:
