audit:
  extends: .rust-base
  stage: security
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends jq
    - cargo install cargo-audit --locked
    - cargo audit --json > cargo-audit-raw.json 2>/dev/null; AUDIT_EXIT=$?
    - |
      jq '{
        "version": "15.0.7",
        "vulnerabilities": (.vulnerabilities.list // [] | map({
          "id": .advisory.id,
          "name": .advisory.title,
          "description": (.advisory.description // ""),
          "severity": (.advisory.severity // "unknown" |
            if . == "critical" then "Critical"
            elif . == "high" then "High"
            elif . == "medium" then "Medium"
            elif . == "low" then "Low"
            else "Unknown" end),
          "identifiers": [{
            "type": "advisory",
            "name": .advisory.id,
            "value": .advisory.id,
            "url": (.advisory.url // "")
          }],
          "links": [{"url": (.advisory.url // "")}],
          "location": {
            "file": "Cargo.lock",
            "dependency": {
              "package": {"name": .package.name},
              "version": .package.version
            }
          }
        }))
      }' cargo-audit-raw.json > gl-dependency-scanning-report.json
    - exit $AUDIT_EXIT
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
