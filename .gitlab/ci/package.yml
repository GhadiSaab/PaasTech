
.cli-rust-base:
  image: rust:1
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    - key:
        files:
          - cli/Cargo.lock
      paths:
        - .cargo/
        - cli/target/
      fallback_keys:
        - cli-rust-fallback

cli-build:
  extends: .cli-rust-base
  stage: package
  before_script:
    - rustup target add x86_64-unknown-linux-musl
    - apt-get update -qq && apt-get install -y -qq musl-tools
  script:
    - cd cli && cargo build --release --target x86_64-unknown-linux-musl
  artifacts:
    paths:
      - cli/target/x86_64-unknown-linux-musl/release/paastech
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

cli-package-deb:
  extends: .cli-rust-base
  stage: package
  needs:
    - job: cli-build
      artifacts: true
  before_script:
    - cargo install cargo-deb --locked
  script:
    - cd cli && cargo deb --no-build --target x86_64-unknown-linux-musl
  artifacts:
    paths:
      - cli/target/x86_64-unknown-linux-musl/debian/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG

cli-package-rpm:
  extends: .cli-rust-base
  stage: package
  needs:
    - job: cli-build
      artifacts: true
  before_script:
    - cargo install cargo-generate-rpm --locked
  script:
    - cd cli && cargo generate-rpm --target x86_64-unknown-linux-musl
  artifacts:
    paths:
      - cli/target/x86_64-unknown-linux-musl/generate-rpm/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG

cli-package-pkgbuild:
  image: alpine:latest
  stage: package
  needs:
    - job: cli-build
      artifacts: true
  script:
    - apk add --no-cache coreutils
    - VERSION=$(grep '^version' cli/Cargo.toml | head -1 | cut -d'"' -f2)
    - SHA256=$(sha256sum cli/target/x86_64-unknown-linux-musl/release/paastech | cut -d' ' -f1)
    - mkdir -p pkgbuild-dist
    - cp cli/target/x86_64-unknown-linux-musl/release/paastech pkgbuild-dist/paastech
    - echo "pkgname=paastech" > pkgbuild-dist/PKGBUILD
    - echo "pkgver=${VERSION}" >> pkgbuild-dist/PKGBUILD
    - echo "pkgrel=1" >> pkgbuild-dist/PKGBUILD
    - echo 'pkgdesc="PaaSTech CLI — deploy and manage your apps"' >> pkgbuild-dist/PKGBUILD
    - echo 'arch=("x86_64")' >> pkgbuild-dist/PKGBUILD
    - echo "url=\"${CI_PROJECT_URL}\"" >> pkgbuild-dist/PKGBUILD
    - echo 'license=("MIT")' >> pkgbuild-dist/PKGBUILD
    - echo 'source=("paastech")' >> pkgbuild-dist/PKGBUILD
    - echo "sha256sums=(\"${SHA256}\")" >> pkgbuild-dist/PKGBUILD
    - echo "" >> pkgbuild-dist/PKGBUILD
    - echo "package() {" >> pkgbuild-dist/PKGBUILD
    - echo '    install -Dm755 "$srcdir/paastech" "$pkgdir/usr/bin/paastech"' >> pkgbuild-dist/PKGBUILD
    - echo "}" >> pkgbuild-dist/PKGBUILD
  artifacts:
    paths:
      - pkgbuild-dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG

cli-upload:
  image: alpine:latest
  stage: package
  needs:
    - job: cli-build
      artifacts: true
    - job: cli-package-deb
      artifacts: true
    - job: cli-package-rpm
      artifacts: true
    - job: cli-package-pkgbuild
      artifacts: true
  script:
    - apk add --no-cache curl
    - DEB=$(find cli/target/x86_64-unknown-linux-musl/debian/ -name "*.deb" | head -1)
    - RPM=$(find cli/target/x86_64-unknown-linux-musl/generate-rpm/ -name "*.rpm" | head -1)
    - BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/paastech-cli/${CI_COMMIT_TAG}"
    - |
      upload() {
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$1" "${BASE}/$2"
      }
    - upload "$DEB" "paastech-${CI_COMMIT_TAG}-amd64.deb"
    - upload "$RPM" "paastech-${CI_COMMIT_TAG}-x86_64.rpm"
    - upload "cli/target/x86_64-unknown-linux-musl/release/paastech" "paastech-x86_64"
    - upload "pkgbuild-dist/PKGBUILD" "PKGBUILD"
  rules:
    - if: $CI_COMMIT_TAG
