
.test-changes: &test_changes
  - src/**/*
  - Cargo.toml
  - Cargo.lock
  - database/**/*
  - services/**/*
  - .sqlx/**/*

test:
  extends: .rust-base
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: docker:27-dind
      alias: docker
  variables:
    POSTGRES_USER: paastech
    POSTGRES_PASSWORD: paastech
    POSTGRES_DB: paastech
    DATABASE_URL: postgresql://paastech:paastech@postgres:5432/paastech
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    SQLX_OFFLINE: "true"
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - until pg_isready -h postgres -U paastech; do echo "waiting for postgres..."; sleep 2; done
    - psql "$DATABASE_URL" -f database/init.sql
    - until bash -c "</dev/tcp/docker/2375" 2>/dev/null; do echo "waiting for docker..."; sleep 2; done
    - cargo install cargo-nextest --locked
  script:
    - cargo nextest run --profile ci
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *test_changes
    - if: $CI_COMMIT_BRANCH
      changes: *test_changes
