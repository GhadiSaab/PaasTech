pages:
  extends: .rust-base
  stage: publish
  needs:
    - job: test
    - job: audit
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo doc --no-deps
    - mv target/doc public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  environment:
    name: documentation
    url: $CI_PAGES_URL
