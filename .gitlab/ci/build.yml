
.docker-base:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container --driver-opt network=host
    - docker buildx inspect --bootstrap

docker-build:
  extends: .docker-base
  stage: publish
  needs:
    - job: test
    - job: audit
  script:
    - |
      docker buildx build \
        --platform linux/amd64 \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE:edge" \
        --push \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
        - Cargo.toml
        - Cargo.lock
        - database/**/*
        - services/**/*
        - .sqlx/**/*
        - Dockerfile

docker-tag:
  extends: .docker-base
  stage: publish
  script:
    - |
      docker buildx build \
        --platform linux/amd64 \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache" \
        --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        --push \
        .
  rules:
    - if: $CI_COMMIT_TAG
