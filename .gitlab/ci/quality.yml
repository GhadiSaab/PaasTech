
stages:
  - lint
  - security
  - documentation

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.rust-base:
  image: rust:latest
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/

fmt:
  extends: .rust-base
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  extends: .rust-base
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

audit:
  extends: .rust-base
  stage: security
  script:
    - cargo install cargo-audit --locked
    - cargo audit

rustdoc:
  extends: .rust-base
  stage: documentation
  script:
    - cargo doc --no-deps
  artifacts:
    paths:
      - target/doc
    expire_in: 1 week
