
ai-review:
  image:
    name: codiumai/pr-agent:latest
    entrypoint: [""]
  stage: review
  variables:
    GITLAB__URL: $CI_SERVER_URL
    GITLAB__PERSONAL_ACCESS_TOKEN: $GITLAB_PERSONAL_ACCESS_TOKEN
    OPENAI__KEY: $AI_REVIEW_API_KEY
    OPENAI__API_BASE: "https://qwen36.do-2023.dev/v1"
    CONFIG__MODEL: "openai/qwen36-27b"
    CONFIG__FALLBACK_MODELS: "[]"
    CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32000"
    CONFIG__GIT_PROVIDER: "gitlab"
    PR_REVIEWER__EXTRA_INSTRUCTIONS: "Set estimated_effort_to_review_[1-5] to 4."
  script:
    - |
      [ -n "$GITLAB__PERSONAL_ACCESS_TOKEN" ] || { echo "GITLAB_PERSONAL_ACCESS_TOKEN is not set"; exit 1; }
      [ -n "$OPENAI__KEY" ] || { echo "AI_REVIEW_API_KEY is not set"; exit 1; }

      cd /app
      python -m pr_agent.cli \
        --pr_url "$CI_PROJECT_URL/merge_requests/$CI_MERGE_REQUEST_IID" \
        review > pr-agent-review.log 2>&1
      status=$?
      cat pr-agent-review.log

      if [ "$status" -ne 0 ]; then
        exit "$status"
      fi

      if grep -Eq "Failed to review PR|Failed to generate prediction with any model" pr-agent-review.log; then
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
