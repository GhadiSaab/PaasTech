[package]
name = "paastech"
version = "0.1.0"
edition = "2024"
description = "PaaSTech CLI — deploy and manage your apps"
license = "MIT"

[[bin]]
name = "paastech"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "PaaSTech : best DO team"
depends = ""
section = "utils"
priority = "optional"
assets = [
  ["target/release/paastech", "/usr/bin/paastech", "755"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/paastech", dest = "/usr/bin/paastech", mode = "0755" },
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls"] }
indicatif = "0.18.4"
colored = "3.1.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
